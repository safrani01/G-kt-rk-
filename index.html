<style>
/* Layout: tek sütun, alt sekme çubuğu; taş gri zemin, gök mavisi vurgu, harfler büyük ve sağdan sola. */
:root{
  --bg:#E6EAE9; --surface:#F4F6F5; --raise:#FFFFFF; --ink:#172025; --muted:#56656A; --line:#C8D1D0;
  --sky:#1C5C86; --sky-ink:#FFFFFF; --sky-soft:#D3E5F0;
  --ok:#2B7A52; --ok-soft:#D6EBDE; --bad:#AE3F2E; --bad-soft:#F3D9D3; --warn:#A8700F; --warn-soft:#F1E3C3;
  --f-head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Hanken Grotesk','Segoe UI',system-ui,sans-serif;
  --f-glyph:'Noto Sans Old Turkic','Noto Sans Old Turkic Regular','Segoe UI Historic','Noto Sans',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1619; --surface:#172126; --raise:#1D2A30; --ink:#E3EBED; --muted:#93A5AA; --line:#2B3A40;
    --sky:#6CB2DB; --sky-ink:#06202E; --sky-soft:#173241;
    --ok:#5BBB88; --ok-soft:#163226; --bad:#E7877A; --bad-soft:#3A1F1B; --warn:#E0B25A; --warn-soft:#3B2E14;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1619; --surface:#172126; --raise:#1D2A30; --ink:#E3EBED; --muted:#93A5AA; --line:#2B3A40;
  --sky:#6CB2DB; --sky-ink:#06202E; --sky-soft:#173241;
  --ok:#5BBB88; --ok-soft:#163226; --bad:#E7877A; --bad-soft:#3A1F1B; --warn:#E0B25A; --warn-soft:#3B2E14;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-top:14px}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.7rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1rem;font-weight:700}
p{margin:0 0 .7em}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.gl{font-family:var(--f-glyph);direction:rtl;unicode-bidi:isolate;line-height:1.25;letter-spacing:.06em}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.top .sub{font-size:.88rem;color:var(--muted)}
.stat{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{font-family:var(--f-head)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.card.raise{background:var(--raise)}
.card h2{margin-bottom:6px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-weight:700;text-align:center}
.btn.main{background:var(--sky);color:var(--sky-ink);border-color:var(--sky)}
.btn.block{display:flex;width:100%}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{min-height:40px;padding:6px 14px;font-size:.92rem}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .3s}
.chips{display:flex;gap:8px;flex-wrap:wrap;direction:ltr}
.chip{min-width:54px;height:62px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--raise);display:flex;align-items:center;justify-content:center;font-size:2rem}
.chip.word{font-size:1.5rem}
button.chip{cursor:pointer}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{display:flex;width:100%;max-width:560px;gap:2px}
.tab{flex:1;min-width:0;background:none;border:0;border-radius:10px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;font-weight:600;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--sky);background:var(--sky-soft)}
/* learn card */
.big{font-size:5.2rem;text-align:center;padding:10px 0 4px}
.big.w{font-size:3.4rem}
.cap{text-align:center}
.cap .sound{font-family:var(--f-head);font-size:1.7rem;font-weight:700}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:rtl;margin:12px 0}
.lt{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;padding:6px 8px;border-radius:10px;background:var(--sky-soft)}
.lt .gl{font-size:1.7rem}
.lt span{font-size:.78rem;font-weight:700;direction:ltr}
.note{background:var(--surface);border-left:4px solid var(--sky);border-radius:0 10px 10px 0;padding:10px 12px;margin:10px 0;font-size:.95rem}
/* exercise */
.q{font-family:var(--f-head);font-size:1.2rem;font-weight:700;margin:6px 0 12px;text-wrap:balance}
.show{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:14px 10px;text-align:center;margin-bottom:14px}
.show .gl{font-size:3.4rem}
.show.lg .gl{font-size:5rem}
.opts{display:grid;gap:10px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{min-height:56px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--raise);font-weight:600;text-align:center;display:flex;align-items:center;justify-content:center}
.opt.gl{font-size:2.3rem;font-weight:400;min-height:76px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:var(--r);padding:12px 14px;margin:14px 0;font-size:.97rem}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.no{background:var(--bad-soft);border:1px solid var(--bad)}
.fb strong{font-family:var(--f-head)}
.slots{min-height:76px;border:2px dashed var(--line);border-radius:var(--r);padding:8px;display:flex;gap:6px;flex-wrap:wrap;direction:rtl;align-items:center;margin-bottom:12px;background:var(--raise)}
.tile{min-width:52px;height:60px;border-radius:10px;border:2px solid var(--line);background:var(--raise);font-size:2rem;display:flex;align-items:center;justify-content:center;padding:0 6px}
.tile.used{opacity:.3}
.tiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;direction:ltr;margin-bottom:14px}
input.txt{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--raise);padding:8px 14px;font-size:1.2rem}
/* tables */
.sec{margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.cell{position:relative;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:8px 4px 6px;text-align:center}
.cell .gl{font-size:2.2rem;display:block}
.cell small{display:block;font-weight:700;font-size:.8rem}
.cell i{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--line)}
.cell i.s1{background:var(--warn)} .cell i.s2{background:var(--ok)}
.sheet{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.ph{background:var(--raise);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.phg{display:flex;flex-wrap:wrap;direction:rtl;gap:4px 6px;align-items:center;margin:6px 0 10px}
.wd{background:none;border:2px solid transparent;border-radius:10px;padding:2px 6px;font-family:var(--f-glyph);font-size:2rem;line-height:1.3;direction:rtl}
.wd.on{border-color:var(--sky);background:var(--sky-soft)}
.sep{color:var(--muted);font-family:var(--f-body);font-size:1.2rem}
.rd{background:var(--sky-soft);border-radius:10px;padding:8px 12px;font-size:.95rem;margin:6px 0}
details.k{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 14px;margin-bottom:10px}
details.k summary{padding:14px 0;font-family:var(--f-head);font-weight:700;cursor:pointer}
details.k .body{padding-bottom:12px}
.ex{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
.ex .gl{font-size:2.2rem}
table.t{border-collapse:collapse;width:100%;font-size:.92rem}
table.t td,table.t th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
textarea.bk{width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--raise);padding:10px;font-size:.8rem;font-family:ui-monospace,monospace}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr .bar{flex:1}
.back{min-height:40px;padding:6px 12px}
.dz{min-width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-weight:700;font-variant-numeric:tabular-nums}
.dz.on{background:var(--ok-soft);border-color:var(--ok)}
.dz.cur{border:2px solid var(--sky)}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
svg.chart .b1{fill:var(--sky)} svg.chart .b2{fill:var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    k('Tam metin ve okuma ipuçları', `<p>Okuma sekmesindeki Tam metin bölümü Kül Tigin yazıtının yedi yüzünü kapsar. Sözcüğe dokununca okunuşunu ve kısa anlamını görürsün. Tek tek sözcük anlamları cümle çevirisinden çıkarıldığı için yaklaşıktır. Ünlüler çoğu yerde yazılmadığı için okunuşta glifte bulunmayan sesler göreceksin; bu normaldir. Her diziyi okuyunca “Okudum” ile işaretle.</p>`) +
    k('Kaynak ve not', `<p>Sözcükler ve cümleler Vikikaynak'taki Kül Tigin yazıtı metninden alındı; okunuşlar ve anlamlar oradaki çevriyazıya ve Türkiye Türkçesi çevirisine dayanır. Aynı sözcüğün yazıtta farklı yazılışları olabilir; uygulama en sık geçen biçimi kullanır. Harfler için "Noto Sans Old Turkic" yazı tipi internetten yüklenir.</p>`);
}
function vIlerleme() {
  const days = []; for (let i = 13; i >= 0; i--) days.push(addDays(todayS(), -i));
  const mx = Math.max(10, ...days.map(d => (S.hist[d] || {}).n || 0));
  const bars = days.map((d, i) => { const h = S.hist[d] || {n: 0, c: 0}, H = 60, a = h.n / mx * H, b = h.c / mx * H; return `<rect class="b2" x="${i * 20 + 4}" y="${70 - a}" width="14" height="${a}" rx="2"/><rect class="b1" x="${i * 20 + 4}" y="${70 - b}" width="14" height="${b}" rx="2"/><text x="${i * 20 + 11}" y="82" text-anchor="middle">${+d.slice(8)}</text>`; }).join('');
  const weak = Object.entries(S.items).filter(([, s]) => s.bad > 0).sort((a, b) => b[1].bad - a[1].bad).slice(0, 6);
  const mastered = Object.values(S.items).filter(s => s.box >= 3).length;
  const tot = Object.values(S.hist).reduce((a, h) => a + h.n, 0), cor = Object.values(S.hist).reduce((a, h) => a + h.c, 0);
  return `<div class="card raise"><div class="stat"><span class="pill">Seri <b>${streak()}</b> gün</span><span class="pill">Öğrenilen <b>${learnedN()}</b>/${ITEMS.length}</span><span class="pill">Pekişen <b>${mastered}</b></span><span class="pill">Doğruluk <b>${tot ? Math.round(cor / tot * 100) : 0}%</b></span></div>
    <h3 style="margin:16px 0 6px">Son 14 gün (cevap sayısı)</h3>
    <svg class="chart" viewBox="0 0 284 88" width="100%" role="img" aria-label="Son 14 günün cevap sayısı">${bars}</svg></div>
    <div class="card"><h3 style="margin-bottom:8px">Zorlandıkların</h3>${weak.length ? `<div class="chips">${weak.map(([id, s]) => `<div class="chip ${BY[id].t === 'W' ? 'word' : ''}" title="${s.bad} yanlış">${G(BY[id].g)}</div>`).join('')}</div>` : '<p class="muted small">Henüz yanlış yok.</p>'}</div>
    <div class="card"><h3 style="margin-bottom:8px">Yedek</h3><p class="muted small">İlerleme bu hesapta ve bu tarayıcıda saklanır. Yedeği kopyalayıp başka yere yapıştırabilirsin.</p>
    <div class="row" style="margin-bottom:8px"><button class="btn sm" data-act="bkshow">Yedeği göster</button><button class="btn sm" data-act="bkload">Yedeği yükle</button></div>
    <textarea class="bk" id="bk" placeholder="Yedek metni burada">${esc(bk)}</textarea>
    <div style="margin-top:12px">${confirmReset ? `<p class="small">Tüm ilerleme silinsin mi?</p><div class="row"><button class="btn sm" data-act="rs2" style="border-color:var(--bad);color:var(--bad)">Evet, sil</button><button class="btn sm ghost" data-act="rs0">Vazgeç</button></div>` : `<button class="btn sm ghost" data-act="rs1">İlerlemeyi sıfırla</button>`}</div></div>`;
}
const ICONS = {
  bugun: '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',
  harf: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  oku: '<path d="M4 5h7a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4zM20 5h-7"/><path d="M20 5v12h-7"/>',
  bilgi: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  ilerle: '<path d="M5 20V10M12 20V4M19 20v-7"/>'
};
const TABS = [['bugun', 'Bugün', 'bugun'], ['harf', 'Harfler', 'harf'], ['oku', 'Okuma', 'oku'], ['bilgi', 'Bilgi', 'bilgi'], ['ilerle', 'İlerleme', 'ilerle']];
function render() {
  const v = {bugun: vBugun, harf: vHarfler, oku: vOkuma, bilgi: vBilgi, ilerle: vIlerleme}[tab]();
  const title = {bugun: 'Göktürk Defteri', harf: 'Harfler ve sözcükler', oku: 'Yazıttan okuma', bilgi: 'Bilgi', ilerle: 'İlerleme'}[tab];
  $('#app').innerHTML = `<div class="wrap"><div class="top"><div><h1>${title}</h1>${tab === 'bugun' ? '<div class="sub">Orhun yazıtları · Kül Tigin</div>' : ''}</div>${tab === 'bugun' ? `<div class="stat"><span class="pill">Seri <b>${streak()}</b></span></div>` : ''}</div>${v}</div>
  <nav class="tabs"><div class="tabs-in">${TABS.map(([id, l, ic]) => `<button class="tab" data-act="tab" data-id="${id}" ${tab === id ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[ic]}</svg>${l}</button>`).join('')}</div></nav>`;
  if (ex && ex.mode === 'type' && !ex.done) { const i = $('#ti'); if (i) { i.addEventListener('keydown', e => { if (e.key === 'Enter') act('check'); }); } }
}
/* ---------- olaylar ---------- */
function act(a, el) {
  const T = S.today;
  if (a === 'tab') { tab = el.dataset.id; sel = null; render(); window.scrollTo(0, 0); }
  else if (a === 'start') startDay();
  else if (a === 'lnext') { if (T.li >= T.newIds.length - 1) { T.stage = 'quiz'; T.idx = 0; ex = null; save(); } else T.li++; render(); window.scrollTo(0, 0); }
  else if (a === 'lprev') { if (T.li > 0) T.li--; render(); }
  else if (a === 'pick' && ex && !ex.done) { const i = +el.dataset.i; ex.sel = i; resolve(ex.opts[i].ok); }
  else if (a === 'tile' && ex && !ex.done) { ex.pick.push(+el.dataset.i); render(); }
  else if (a === 'untile' && ex && !ex.done) { ex.pick.splice(+el.dataset.i, 1); render(); }
  else if (a === 'check' && ex && !ex.done) {
    if (ex.mode === 'tiles') resolve(ex.pick.map(i => ex.tiles[i]).join('') === ex.it.g);
    else { const v = ($('#ti') || {}).value || ''; if (!norm(v)) return; ex.val = v; resolve(norm(v) === norm(ex.it.o)); }
  }
  else if (a === 'next') next();
  else if (a === 'sub') { sub = el.dataset.v; sel = null; render(); }
  else if (a === 'sel') { sel = el.dataset.id; render(); window.scrollTo(0, 0); }
  else if (a === 'selx') { sel = null; render(); }
  else if (a === 'pw') { const p = el.dataset.p, i = +el.dataset.i; phWord[p] = phWord[p] === i ? null : i; render(); }
  else if (a === 'pt') { phOpen[el.dataset.p] = !phOpen[el.dataset.p]; render(); }
  else if (a === 'rsub') { rsub = el.dataset.v; render(); }
  else if (a === 'tsel') { tsel = el.dataset.id; twi = null; tShowC = false; tShowTr = false; render(); window.scrollTo(0, 0); }
  else if (a === 'tw') { const k = +el.dataset.i; twi = twi === k ? null : k; render(); }
  else if (a === 'tc') { tShowC = !tShowC; render(); }
  else if (a === 'ttr') { tShowTr = !tShowTr; render(); }
  else if (a === 'td') { const R = RD(); if (R[tsel]) delete R[tsel]; else R[tsel] = 1; save(); render(); }
  else if (a === 'tnav') { const i = D.T.findIndex(x => x.id === tsel) + (+el.dataset.d); if (D.T[i]) { tsel = D.T[i].id; twi = null; tShowC = false; tShowTr = false; render(); window.scrollTo(0, 0); } }
  else if (a === 'tnext' || a === 'trand') { const R = RD(), un = D.T.filter(x => !R[x.id]); const pool = un.length ? un : D.T; const t = a === 'tnext' ? pool[0] : pool[Math.floor(Math.random() * pool.length)]; tsel = t.id; twi = null; tShowC = false; tShowTr = false; render(); window.scrollTo(0, 0); }
  else if (a === 'pd') { S.ph[el.dataset.p] = 1; save(); render(); }
  else if (a === 'bkshow') { bk = JSON.stringify(S); render(); }
  else if (a === 'bkload') {
    try { const o = JSON.parse(($('#bk') || {}).value || ''); if (o && o.v === 1 && o.items) { S = o; save(); bk = ''; ex = null; render(); } else bk = 'Geçersiz yedek.'; } catch (e) { bk = 'Geçersiz yedek.'; } render();
  }
  else if (a === 'rs1') { confirmReset = true; render(); }
  else if (a === 'rs0') { confirmReset = false; render(); }
  else if (a === 'rs2') { S = fresh(); save(); confirmReset = false; ex = null; render(); }
}
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && !el.disabled) act(el.dataset.act, el); });
render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
